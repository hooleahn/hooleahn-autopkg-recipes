Description: Downloads the latest version of Node.js 26.x and creates an installer package.
Identifier: com.github.hooleahn.pkg.nodejs26
ParentRecipe: com.github.hooleahn.download.nodejs26
MinimumVersion: '2.9'

Input:
  NAME: Node.js
  SOFTWARE_TITLE: node

Process:
  - Processor: PkgCopier
    Arguments:
      pkg_path: '%RECIPE_CACHE_DIR%/%SOFTWARE_TITLE%-%version%.pkg'
      source_pkg: '%pathname%'